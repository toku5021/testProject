<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケポケ カード管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>🎴 ポケポケ カード管理</h1>
      <p>銀星 (◆1〜◆4) 専用 / 3アカウント連動コレクションチェッカー</p>
    </div>
  </header>

  <main class="container">
    <!-- 全体ステータス・バックアップ -->
    <section class="card-panel">
      <div class="summary-header">
        <div>
          <h2>全アカウント コレクション率</h2>
          <div id="total-progress" class="big-number">読み込み中...</div>
          <p class="sub-text">※3アカウント中1枚でも所有していれば「保持」扱いとなります</p>
        </div>
        <div class="button-group">
          <button id="export-btn" class="btn btn-secondary">バックアップ (JSON)</button>
          <label class="btn btn-secondary">
            復元
            <input id="import-file" type="file" accept=".json" hidden>
          </label>
          <button id="reset-btn" class="btn btn-danger">全リセット</button>
        </div>
      </div>
      <div class="progress-bar"><div id="total-progress-bar"></div></div>
      <div id="status-message" class="status-message">最新カードデータを取得中...</div>
    </section>

    <!-- アカウント選択 -->
    <section class="card-panel">
      <h2>操作アカウント切り替え</h2>
      <div id="account-tabs" class="account-tabs"></div>
      <p class="sub-text">枚数を＋/ーで入力したいアカウントを選択してください。</p>
    </section>

    <!-- パック一覧ビュー -->
    <section id="pack-view">
      <div class="section-header">
        <h2>パック一覧</h2>
        <input id="search-pack" class="search-input" type="search" placeholder="パック名・セット名で検索...">
      </div>
      <div id="pack-list"></div>
    </section>

    <!-- カード一覧ビュー -->
    <section id="card-view" class="hidden">
      <button id="back-btn" class="btn btn-secondary">← パック一覧に戻る</button>
      
      <div class="card-panel pack-title-panel">
        <div>
          <div id="breadcrumb" class="breadcrumb"></div>
          <h2 id="selected-pack-name"></h2>
          <div id="pack-progress-text" class="sub-text"></div>
        </div>
        <div class="progress-bar small"><div id="pack-progress-bar"></div></div>
      </div>

      <div class="account-banner">
        現在の入力対象：<strong id="active-account-label"></strong>
      </div>

      <!-- フィルター controls -->
      <div class="toolbar">
        <input id="search-card" class="search-input" type="search" placeholder="カード名・番号で検索...">
        
        <div class="filter-group">
          <span class="filter-label">状態:</span>
          <button class="filter-btn active" data-filter="all">すべて</button>
          <button class="filter-btn" data-filter="missing">未保持</button>
          <button class="filter-btn" data-filter="owned">保持済</button>
        </div>

        <div class="filter-group">
          <span class="filter-label">レアリティ:</span>
          <button class="rarity-btn active" data-rarity="all">すべて</button>
          <button class="rarity-btn" data-rarity="◊">◆1</button>
          <button class="rarity-btn" data-rarity="◊◊">◆2</button>
          <button class="rarity-btn" data-rarity="◊◊◊">◆3</button>
          <button class="rarity-btn" data-rarity="◊◊◊◊">◆4</button>
        </div>
      </div>

      <div id="card-grid" class="card-grid"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
