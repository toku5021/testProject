<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ポケポケ カード管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div>
    <h1>ポケポケ カード管理</h1>
    <p>複数アカウントのカード所持状況をまとめて管理</p>
  </div>
</header>

<main class="container">
  <section class="summary-card">
    <div class="summary-top">
      <div>
        <h2>コレクション状況</h2>
        <div id="total-progress" class="big-number">読み込み中...</div>
        <div class="summary-note">※1枚でも誰かのアカウントが所持していれば「所持」として集計</div>
      </div>
      <div class="summary-actions">
        <button id="export-button" class="secondary-button">バックアップ</button>
        <label class="secondary-button file-button">
          復元
          <input id="import-file" type="file" accept=".json,application/json">
        </label>
        <button id="reset-button" class="danger-button">所持情報をリセット</button>
      </div>
    </div>
    <div class="progress-bar"><div id="total-progress-bar"></div></div>
    <div id="data-status" class="status">カードデータを読み込んでいます...</div>
  </section>

  <section class="account-section">
    <div class="section-title-row">
      <h2>アカウント管理</h2>
      <button id="add-account-button" class="primary-button">＋ アカウント追加</button>
    </div>
    <div id="account-list" class="account-list"></div>
    <div class="account-help">
      カードの枚数を入力するアカウントを選択してください。カードが複数アカウントのどれかに1枚でもあれば、全体では「所持」になります。
    </div>
  </section>

  <section id="home-section">
    <div class="section-title-row">
      <h2>パック一覧</h2>
      <input id="search-pack" class="search" type="search" placeholder="パックを検索">
    </div>
    <div id="pack-list"></div>
  </section>

  <section id="card-section" class="hidden">
    <button id="back-button" class="back-button">← パック一覧</button>

    <div class="pack-title-card">
      <div>
        <div id="breadcrumb" class="breadcrumb"></div>
        <h2 id="selected-pack-name"></h2>
        <div id="pack-progress-text"></div>
      </div>
      <div class="progress-bar small"><div id="pack-progress-bar"></div></div>
    </div>

    <div class="selected-account-banner">
      <span>入力対象アカウント：</span>
      <strong id="selected-account-name"></strong>
    </div>

    <div class="toolbar">
      <input id="search-card" class="search" type="search" placeholder="カード名・番号を検索">
      <div class="filters">
        <button class="filter-button active" data-filter="all">すべて</button>
        <button class="filter-button" data-filter="missing">未所持</button>
        <button class="filter-button" data-filter="owned">所持</button>
      </div>
    </div>
    <div class="rarity-toolbar">
      <span>レアリティ：</span>
      <div id="rarity-filters" class="filters"></div>
    </div>

    <div id="card-list" class="card-list"></div>
  </section>
</main>

<div id="account-modal" class="modal hidden">
  <div class="modal-panel">
    <h2>アカウント追加</h2>
    <input id="new-account-name" class="modal-input" type="text" maxlength="30" placeholder="例：メイン">
    <div class="modal-actions">
      <button id="cancel-account-button" class="secondary-button">キャンセル</button>
      <button id="save-account-button" class="primary-button">追加</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
