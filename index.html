<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Keyboard Test</title>
<style>
body {
    font-family: sans-serif;
    padding: 20px;
}
.section {
    margin-bottom: 30px;
}
input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    box-sizing: border-box;
}
h2 {
    margin-bottom: 5px;
}
</style>
</head>
<body>

<h1>iOS入力モード確認</h1>

<div class="section">
    <h2>① type="text"</h2>
    <input type="text" placeholder="text">
</div>

<div class="section">
    <h2>② type="text" inputmode="email"</h2>
    <input type="text" inputmode="email" placeholder="text + email">
</div>

<div class="section">
    <h2>③ type="email"</h2>
    <input type="email" placeholder="email">
</div>

<div class="section">
    <h2>④ type="email" inputmode="email"</h2>
    <input type="email" inputmode="email" placeholder="email + email">
</div>

<div class="section">
    <h2>⑤ type="text" inputmode="latin"</h2>
    <input type="text" inputmode="latin" placeholder="latin">
</div>

<div class="section">
    <h2>⑥ type="text" inputmode="url"</h2>
    <input type="text" inputmode="url" placeholder="url">
</div>

<div class="section">
    <h2>⑦ type="password"</h2>
    <input type="password" placeholder="password">
</div>

<div class="section">
    <h2>⑧ type="password" → type="email"</h2>
    <input id="hackInput" type="password" placeholder="password → email">
    <button onclick="changeType()">type=emailへ変更</button>
</div>

<div class="section">
    <h2>⑨ autocomplete=email</h2>
    <input
        type="text"
        inputmode="email"
        autocomplete="email"
        placeholder="autocomplete=email">
</div>

<div class="section">
    <h2>⑩ 推奨パターン</h2>
    <input
        type="email"
        inputmode="email"
        autocomplete="email"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        placeholder="recommended">
</div>

<script>
function changeType() {
    document.getElementById("hackInput").type = "email";
}
</script>

</body>
</html>
