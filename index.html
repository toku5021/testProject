<!DOCTYPE html>
<html lang="ja">
<head>

	<style>

			-webkit-appearance: none;
		}
		/* バルーンエラー用表示スタイル (1.txtより) */
		.baloonBox { display: none; position: absolute; z-index: 10000; }
		.baloon.red { background: #ff3b30; color: white; padding: 10px; border-radius: 8px; }

	<script src="https://code.jquery.com/jquery-1.8.3.min.js"></script>
</head>
<body>

	<form method="POST" action="" name="MainForm" onSubmit="return false;" autocomplete="off" novalidate>

		<input type="hidden" id="diffMail2" value="&lowast;&lowast;bt&lowast;&lowast;t0&lowast;&lowast;@test.net">

					<div class="space05 chbxTextLine">

	<script>
		jQuery(function($){
			var pageId = $( 'input[name="_PAGEID"]' ).val();
			
			// ラジオボタン(#caption00)クリックによるエリア開閉
			$("#caption00").on("click", function() {
				if($('#list00').css('display') != 'block'){
					$("#list00").slideToggle("fast");
				}
			});
		});
	</script>

	<script>
		var jaac00013_04Validation = function(){};
		jaac00013_04Validation.Fn = {
			initialize : function() {
				// 入力時(keyup)イベントハンドラ設定
				$("#email1_1").keyup(jaac00013_04Validation.Events.inputMail1_1);
				$("#email1_2").keyup(jaac00013_04Validation.Events.inputMail1_2);
				// フォーカスアウト時(blur)イベントハンドラ設定
				$("#email1_1").blur(jaac00013_04Validation.Events.inputMail1_1);
				$("#email1_2").blur(jaac00013_04Validation.Events.inputMail1_2);
				
				// 【今回追加】「最初にカーソルを合わせた瞬間」の再現性を100%にするためfocus時にもバインド
				$("#email1_1").focus(jaac00013_04Validation.Events.inputMail1_1);
			}
		};
		jaac00013_04Validation.Events = {
			inputMail1_1 : function(){
				CommonValidation.MailAdressCheck( jaac00013_04Validation.ValidationOption.MAIL_ADRESS_1_1, true );
				CommonValidation.IsNotSameValue( jaac00013_04Validation.ValidationOption.DIFF_MAIL_ADRESS_1, false, false, true );
				CommonValidation.IsSameValue( jaac00013_04Validation.ValidationOption.SAME_MAIL_ADRESS_1, false, false, true );
			},
			inputMail1_2 : function(){
				CommonValidation.MailAdressCheck( jaac00013_04Validation.ValidationOption.MAIL_ADRESS_1_2, true );
				CommonValidation.IsSameValue( jaac00013_04Validation.ValidationOption.SAME_MAIL_ADRESS_1, false, false, true );
			}
		};
		jaac00013_04Validation.ValidationOption = {
			MAIL_ADRESS_1_1 : { targetId: "email1_1", label: new Array("新しいメールアドレス1"), emArea: "mail1_1EmArea", bgEmArea: "mail1BgEmArea", emIdTei: "CMNE00000_CE64" },
			MAIL_ADRESS_1_2 : { targetId: "email1_2", label: new Array("新しいメールアドレス1（確認用）"), emArea: "mail1_2EmArea", bgEmArea: "mail1BgEmArea", emIdTei: "CMNE00000_CE64" },
			DIFF_MAIL_ADRESS_1 : { targetId1: "diffMail1", targetId2: "email1_1", label: new Array(""), emArea1: "mail1_1EmArea", emArea2: "mail1_1EmArea", bgEmArea1: "mail1BgEmArea", bgEmArea2: "mail1BgEmArea", emIdSame: "JAAC00013_CE05" },
			SAME_MAIL_ADRESS_1 : { targetId1: "email1_1", targetId2: "email1_2", label: new Array("新しいメールアドレス1", "新しいメールアドレス1（確認用）"), emArea1: "mail1_1EmArea", emArea2: "mail1_2EmArea", bgEmArea1: "mail1BgEmArea", bgEmArea2: "mail1BgEmArea", emIdSame: "CMNE00000_CE21" }
		};
		jQuery(function($){ jaac00013_04Validation.Fn.initialize(); });
	</script>

	<script>
		var CommonValidation = function() {};
		CommonValidation.isVisible = function() { return true; }; // 簡易化
		CommonValidation.checkExistParam = function() { return true; };
		CommonValidation.checkExistElem = function() { return true; };
		
		// 4.txt: 1644行目～ メールアドレス入力チェックの再現
		CommonValidation.MailAdressCheck = function( option, isInput ){
			var val = $("#" + option.targetId).val();
			// 4.txt: 1648行目エラーメッセージ削除処理の完全再現
			if( $('#CMNE00000_CE18_email1').length != 0 ){
				$("#dummy-error").remove(); // 本番のBhBase.Formのクリア処理をシミュレート
			}
			return true;
		};
		// 4.txt: 1655行目～ 同一チェックの再現
		CommonValidation.IsSameValue = function( option, er_1, er_2, isInput ){
			var msgId_1 = option.emIdSame + "_" + option.targetId1;
			if( isInput ){
				// 本番のメッセージ削除処理
				$("#" + msgId_1).remove();
			}
			return true;
		};
		// 4.txt: 1662行目～ 不一致チェックの再現
		CommonValidation.IsNotSameValue = function( option, er_1, er_2, isInput ){
			var msgId_1 = option.emIdSame + option.targetId1;
			if( isInput ){
				$("#" + msgId_1).remove();
			}
			return true;
		};
	</script>
