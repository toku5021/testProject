<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーボードリセットテスト（安定版）</title>
    <style>
        /* ダミー用の隠し入力欄（画面外に飛ばして完全に見えなくする） */
        .dummy-hidden {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>

    <form method="POST" action="">
        <input type="text" id="keyboard_dummy" class="dummy-hidden" tabIndex="-1">

        <label for="email_target">メールアドレス２入力：</label>
        <input 
            type="email" 
            id="email_target" 
            name="USER_EMAIL" 
            inputmode="email"
            autocomplete="email"
            placeholder="username@example.com">
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var emailInput = document.getElementById("email_target");
            var dummyInput = document.getElementById("keyboard_dummy");

            // ユーザーがタップした瞬間に実行
            emailInput.addEventListener("touchstart", function(e) {
                // すでにフォーカスが当たっている場合はリセット処理をスキップ（入力中の邪魔をしない）
                if (document.activeElement === emailInput) {
                    return;
                }

                // 一時的にダミー欄にフォーカスを奪い、直前のキーボードを破棄させる
                dummyInput.focus();

                // わずか10ミリ秒（ブラウザの1フレーム未満）の遅延で本命の入力欄にフォーカスを戻す
                setTimeout(function() {
                    emailInput.focus();
                }, 10);
            });
        });
    </script>

</body>
</html>
